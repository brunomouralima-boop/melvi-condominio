# ───────────────────────────────────────────────────────────────
# Melvi Condomínio — Nginx config interno do container frontend
# Serve apenas os ficheiros estáticos do Vite. O reverse proxy
# externo (nginx/nginx.conf na raiz) é que trata de SSL e
# encaminha /api e /socket.io para o backend.
# ───────────────────────────────────────────────────────────────

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health do próprio nginx (usado pelo HEALTHCHECK do Dockerfile)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Cache agressivo para assets versionados pelo Vite (hash no nome)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — qualquer rota client-side cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
        # index.html não deve ser cached agressivamente (auto-refresh em deploys)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Headers de segurança (também aplicados no reverse proxy, mas redundante = OK)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
