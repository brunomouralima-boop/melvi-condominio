# ───────────────────────────────────────────────────────────────
# Melvi Condomínio — Reverse proxy principal
#
# Este nginx fica à frente de tudo:
#   - Redireccionamento HTTP → HTTPS
#   - SSL (Let's Encrypt via certbot)
#   - Proxy para frontend:80 (SPA)
#   - Proxy para backend:4000/api (REST)
#   - Proxy para backend:4000/socket.io (WebSocket)
#   - Proxy para backend:4000/uploads (estáticos do backend)
#
# IMPORTANTE: as referências a ${DOMAIN} são substituídas pelo
# arranque via envsubst (ver docker-compose.yml).
# ───────────────────────────────────────────────────────────────

# Limites e timeouts globais
client_max_body_size 50M;
proxy_read_timeout 300s;
proxy_connect_timeout 75s;

# Gzip (replica config do frontend para tráfego que passa por aqui)
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    image/svg+xml;

# ─── HTTP (porta 80) ──────────────────────────────────────────
# Apenas: ACME challenge + redirect para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} www.${DOMAIN};

    # ACME challenge do Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tudo o resto → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS (porta 443) ────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN} www.${DOMAIN};

    # Certificados Let's Encrypt (criados pelo certbot)
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # SSL config moderna (Mozilla intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Headers de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── /api → backend:4000/api ────────────────────────────────
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── /socket.io → backend:4000/socket.io (WebSocket) ────────
    location /socket.io/ {
        proxy_pass http://backend:4000/socket.io/;
        proxy_http_version 1.1;
        # WebSocket upgrade headers
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Manter conexão aberta longamente
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── /uploads → backend:4000/uploads (imagens) ──────────────
    location /uploads/ {
        proxy_pass http://backend:4000/uploads/;
        proxy_set_header Host $host;
        # Cache no nginx (1 dia) — uploads não mudam após criados
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public";
    }

    # ── ACME challenge (renovação SSL) ─────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── / → frontend:80 (SPA) ──────────────────────────────────
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
