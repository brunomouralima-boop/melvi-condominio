# ───────────────────────────────────────────────────────────────
# Melvi Condomínio — Reverse proxy (BOOTSTRAP HTTP-only)
#
# Usado no PRIMEIRO arranque, ANTES de termos certificados SSL.
# Permite que o certbot complete o ACME challenge.
# Depois do `scripts/ssl.sh` correr, o nginx é reconfigurado para
# usar nginx.conf (com HTTPS).
# ───────────────────────────────────────────────────────────────

client_max_body_size 50M;
proxy_read_timeout 300s;

gzip on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME challenge (sempre acessível para renovação)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io
    location /socket.io/ {
        proxy_pass http://backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Uploads
    location /uploads/ {
        proxy_pass http://backend:4000/uploads/;
        proxy_set_header Host $host;
    }

    # SPA
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
